apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-deprecation-watchdog.fullname" . }}
  labels:
    {{- include "api-deprecation-watchdog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "api-deprecation-watchdog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-deprecation-watchdog.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "api-deprecation-watchdog.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "api-deprecation-watchdog.name" . }}
          image: {{ include "api-deprecation-watchdog.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.config.pollIntervalSeconds | quote }}
            - name: FETCH_TIMEOUT_SECONDS
              value: {{ .Values.config.fetchTimeoutSeconds | quote }}
            - name: FETCH_MAX_BYTES
              value: {{ .Values.config.fetchMaxBytes | quote }}
            - name: DISABLE_SCHEDULER
              value: {{ .Values.config.disableScheduler | quote }}
            - name: SEED_SOURCES
              value: {{ .Values.config.seedSources | quote }}
            - name: NOTIFY_CHANNELS
              value: {{ .Values.config.notifyChannels | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DIGEST_MODE
              value: {{ .Values.config.digestMode | quote }}
            - name: DIGEST_INTERVAL_SECONDS
              value: {{ .Values.config.digestIntervalSeconds | quote }}
            - name: DIGEST_MAX_ALERTS
              value: {{ .Values.config.digestMaxAlerts | quote }}
            - name: BREAKER_THRESHOLD
              value: {{ .Values.config.breakerThreshold | quote }}
            - name: BREAKER_COOLDOWN_SECONDS
              value: {{ .Values.config.breakerCooldownSeconds | quote }}
            {{- if .Values.existingSecret }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: API_TOKEN
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SLACK_WEBHOOK_URL
                  optional: true
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WEBHOOK_URL
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SMTP_FROM
                  optional: true
            - name: SMTP_TO
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SMTP_TO
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "api-deprecation-watchdog.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
