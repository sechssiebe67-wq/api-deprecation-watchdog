apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-deprecation-watchdog.serviceAccountName" . }}
  labels:
    {{- include "api-deprecation-watchdog.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
